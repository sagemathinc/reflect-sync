name: Managed rsync runtime

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 26.7.0

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential musl-tools file
      - name: Build and test runtime
        run: sh scripts/build-rsync-runtime.sh "dist/rsync-runtime/${{ matrix.target }}"
      - name: Package runtime and corresponding source
        run: node scripts/package-rsync-runtime.mjs "dist/rsync-runtime/${{ matrix.target }}"
      - name: Smoke-test installed archive
        run: node scripts/test-rsync-runtime-package.mjs
      - name: Upload tested runtime archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reflect-sync-rsync-${{ matrix.target }}
          path: |
            dist/release/reflect-sync-rsync-*-${{ matrix.target }}.*
            dist/release/reflect-sync-rsync-*-sources.tar.gz*
            dist/rsync-runtime/${{ matrix.target }}/manifest.json
          if-no-files-found: error
