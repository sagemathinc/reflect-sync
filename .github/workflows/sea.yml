name: Node 26 SEA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 26.7.0
  PNPM_VERSION: 11.25.0

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build SEA
        run: pnpm sea
      - name: Smoke-test exact SEA
        run: pnpm test:sea
      - name: Package canonical release archive
        run: pnpm package:sea
      - name: Smoke-test installed archive
        run: pnpm test:sea-package
      - name: Upload internal release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reflect-sync-${{ matrix.target }}-internal
          path: |
            dist/release/reflect-sync-${{ matrix.target }}.*
            dist/sea/build-info-${{ matrix.target }}.json
          if-no-files-found: error
